<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mabarin - Game Station</title>
  <meta name="description" content="Mabarin: kumpulan game seru untuk dimainkan bareng teman, 1 sampai 4 pemain dalam satu perangkat.">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mabarin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ============ HALAMAN JUDUL (SPLASH) ============ -->
    <section class="screen screen--splash is-active" id="screen-splash" aria-label="Memuat">
      <div class="splash__center">
        <div class="logo logo--lg">
          <div class="logo__top" aria-hidden="true">
            <span class="c-red">G</span><span class="c-blue">A</span><span class="c-green">M</span><span class="c-yellow">E</span>
            <span class="logo__gap"></span>
            <span class="c-red">S</span><span class="c-blue">T</span><span class="c-green">A</span><span class="c-yellow">T</span><span class="c-red">I</span><span class="c-blue">O</span><span class="c-green">N</span>
          </div>
          <h1 class="logo__title">MABARIN</h1>
          <div class="logo__bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="splash__bottom">
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress__fill" id="splash-fill"><span class="progress__text" id="splash-text">0%</span></div>
        </div>
      </div>
    </section>

    <!-- ============ HALAMAN UTAMA ============ -->
    <section class="screen screen--home" id="screen-home" aria-label="Menu utama">
      <header class="topbar">
        <button class="icon-btn" data-action="open-drawer" aria-label="Buka menu">
          <svg viewBox="0 0 32 24" class="burger"><rect x="0" y="1" width="28" height="4" rx="2"/><rect x="0" y="10" width="20" height="4" rx="2"/><rect x="0" y="19" width="12" height="4" rx="2"/></svg>
        </button>
        <button class="chip-btn" id="install-btn" data-action="install" hidden>
          <span class="chip-btn__icon">
            <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          PASANG APP
        </button>
      </header>

      <main class="home__body">
        <div class="logo logo--md">
          <div class="logo__top" aria-hidden="true">
            <span class="c-red">G</span><span class="c-blue">A</span><span class="c-green">M</span><span class="c-yellow">E</span>
            <span class="logo__gap"></span>
            <span class="c-red">S</span><span class="c-blue">T</span><span class="c-green">A</span><span class="c-yellow">T</span><span class="c-red">I</span><span class="c-blue">O</span><span class="c-green">N</span>
          </div>
          <h2 class="logo__title">MABARIN</h2>
          <div class="logo__bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="mode-grid" id="mode-grid"><!-- diisi oleh js --></div>

        <button class="share-btn" data-action="share">
          <svg viewBox="0 0 24 24" class="share-btn__icon"><circle cx="18" cy="5" r="3.2"/><circle cx="6" cy="12" r="3.2"/><circle cx="18" cy="19" r="3.2"/><path d="M8.6 10.5 15.4 6.5M8.6 13.5l6.8 4" stroke="currentColor" stroke-width="2.4"/></svg>
          <span>AJAK<br>TEMAN!</span>
        </button>
      </main>
    </section>

    <!-- ============ HALAMAN KATEGORI ============ -->
    <section class="screen screen--category" id="screen-category" aria-label="Daftar game">
      <header class="topbar topbar--title">
        <button class="icon-btn icon-btn--back" data-action="back" aria-label="Kembali">
          <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 class="topbar__title" id="category-title">GAME</h2>
        <span class="icon-btn" aria-hidden="true"></span>
      </header>
      <main class="category__body">
        <div class="game-grid" id="game-grid"><!-- diisi oleh js --></div>
      </main>
    </section>

    <!-- ============ HALAMAN PENGATURAN ============ -->
    <section class="screen screen--settings" id="screen-settings" aria-label="Pengaturan">
      <header class="topbar topbar--title">
        <button class="icon-btn icon-btn--back" data-action="back" aria-label="Kembali">
          <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 class="topbar__title">PENGATURAN</h2>
        <span class="icon-btn" aria-hidden="true"></span>
      </header>
      <main class="settings__body">

        <div class="panel">
          <h3 class="panel__title">Umum</h3>
          <label class="row">
            <span class="row__icon bg-blue">
              <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="row__label">Efek Suara</span>
            <input type="checkbox" class="switch" data-setting="sound">
          </label>
          <label class="row">
            <span class="row__icon bg-green">
              <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M3 9v6M21 9v6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
            <span class="row__label">Getaran</span>
            <input type="checkbox" class="switch" data-setting="vibrate">
          </label>
          <label class="row">
            <span class="row__icon bg-purple">
              <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#fff"/></svg>
            </span>
            <span class="row__label">Mode Gelap</span>
            <input type="checkbox" class="switch" data-setting="dark">
          </label>
          <label class="row" id="row-fullscreen">
            <span class="row__icon bg-yellow">
              <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="row__label">Layar Penuh</span>
            <input type="checkbox" class="switch" data-setting="fullscreen">
          </label>
        </div>


        <div class="panel">
          <h3 class="panel__title">Aplikasi</h3>
          <button class="row row--btn" data-action="reset">
            <span class="row__icon bg-red">
              <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="row__label">Reset Semua Data</span>
            <span class="row__chev">›</span>
          </button>
        </div>

        <div class="about">
          <div class="logo logo--sm">
            <h3 class="logo__title">MABARIN</h3>
            <div class="logo__bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          </div>
          <p>Game Station &middot; versi <span id="app-version"></span></p>
          <p class="about__muted">Main bareng, seru bareng! Game baru ditambahkan secara berkala.</p>
        </div>
      </main>
    </section>

    <!-- ============ DRAWER ============ -->
    <div class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer__scrim" data-action="close-drawer"></div>
      <nav class="drawer__panel">
        <div class="logo logo--sm">
          <h3 class="logo__title">MABARIN</h3>
          <div class="logo__bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <button class="drawer__item" data-nav="home" data-close>Beranda</button>
        <button class="drawer__item" data-nav="settings" data-close>Pengaturan</button>
        <button class="drawer__item" id="drawer-install" data-action="install" data-close>Pasang Aplikasi</button>
        <button class="drawer__item" data-action="share" data-close>Ajak Teman</button>
      </nav>
    </div>

    <!-- ============ MODAL & TOAST ============ -->
    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal__card" role="dialog" aria-modal="true">
        <h3 class="modal__title" id="modal-title"></h3>
        <p class="modal__text" id="modal-text"></p>
        <div class="modal__actions" id="modal-actions"></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
