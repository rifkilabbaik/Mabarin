# Build game lalu deploy ke GitHub Pages setiap ada push ke main.
# Aktifkan sekali: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Bila Pages masih diset "Deploy from a branch", GitHub juga menjalankan "pages build and deployment"
      # yang menerbitkan file mentah. Tunggu itu selesai dulu supaya hasil build ini yang terakhir terbit.
      - name: Tunggu build Pages bawaan selesai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 50); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            if [ "$n" = "0" ]; then echo "siap deploy"; break; fi
            echo "menunggu pages build and deployment ($i)…"; sleep 6
          done
      - id: deployment
        uses: actions/deploy-pages@v5
